<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- Viewport ini memaksa layar HP tidak bisa di-zoom atau di-scroll -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>HeartCake</title>
    <style>
        /* Membuang semua jarak (margin/padding) dan mematikan scroll */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Memaksa canvas game mengambil 100% area layar */
        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Teks loading sederhana di tengah layar */
        #loading-text {
            position: absolute;
            color: white;
            font-family: sans-serif;
            font-size: 18px;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <!-- Canvas Utama Game -->
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <!-- Teks Loading -->
    <div id="loading-text">Loading HeartCake... 0%</div>

    <script>
        var canvas = document.querySelector("#unity-canvas");
        var loadingText = document.querySelector("#loading-text");

        // Menggunakan data spesifik dari game kamu (HeartCake)
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/HeartCakev1.0.0.loader.js";
        var config = {
            dataUrl: buildUrl + "/HeartCakev1.0.0.data.unityweb",
            frameworkUrl: buildUrl + "/HeartCakev1.0.0.framework.js.unityweb",
            codeUrl: buildUrl + "/HeartCakev1.0.0.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "HeartCake",
            productVersion: "1.0.2"
        };

        // Proses memuat game
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                // Update persentase loading
                loadingText.innerHTML = "Loading HeartCake... " + Math.round(progress * 100) + "%";
            }).then((unityInstance) => {
                // Sembunyikan teks loading kalau game sudah siap
                loadingText.style.display = "none";
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);
    </script>
</body>

</html>
